services:
  - type: web
    name: vantage-api
    runtime: python
    region: virginia
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vantage-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://vantage-hackathon.vercel.app
      - key: CORS_ALLOW_ORIGINS
        value: https://vantage-hackathon.vercel.app

databases:
  - name: vantage-postgres
    databaseName: vantage
    region: virginia
    plan: free
    ipAllowList: []
